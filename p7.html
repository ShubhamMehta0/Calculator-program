<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="p7.css">
</head>
<body>
    <div id="wrapper">
        <input id="display" readonly>

        <div id="buttons">
            <button onclick="del()" class="specialBtns">Del</button>
            <button onclick="clearDisplay()" class="specialBtns">AC</button>
            <button onclick="addToDisplay('%')" class="specialBtns">Rem</button>

            <button onclick="addToDisplay('/')" class="opBtns">/</button>
            <button onclick="addToDisplay('7')">7</button>
            <button onclick="addToDisplay('8')">8</button>
            <button onclick="addToDisplay('9')">9</button>
            <button onclick="addToDisplay('*')" class="opBtns">x</button>
            <button onclick="addToDisplay('4')">4</button>
            <button onclick="addToDisplay('5')">5</button>
            <button onclick="addToDisplay('6')">6</button>
            <button onclick="addToDisplay('-')" class="opBtns">-</button>
            <button onclick="addToDisplay('1')">1</button>
            <button onclick="addToDisplay('2')">2</button>
            <button onclick="addToDisplay('3')">3</button>
            <button onclick="addToDisplay('+')" class="opBtns">+</button>
            <button onclick="addToDisplay('00')">00</button>
            <button onclick="addToDisplay('0')">0</button>
            <button onclick="addToDisplay('.')">.</button>
            <button onclick="calculate()" class="opBtns">=</button>

        </div>
    </div>

    <script src="p7.js"></script>
</body>
</html>
